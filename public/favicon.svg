<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#4c0519" />
      <stop offset="60%" stop-color="#1f020a" />
      <stop offset="100%" stop-color="#0a0104" />
    </radialGradient>

    <!-- Ruby Main Facet Gradient -->
    <linearGradient id="rubyTop" x1="16" y1="14" x2="48" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="45%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>

    <linearGradient id="rubyBottom" x1="32" y1="26" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>

    <linearGradient id="facetHighlight" x1="20" y1="14" x2="32" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fda4af" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="goldStarGrad" x1="42" y1="10" x2="52" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="rubyGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleAura" x="-40%" y="-40%" width="180%" height="180%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="8" />
    </filter>
  </defs>

  <!-- Base Icon Background (Squircle) -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#be123c" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Ambient Rose Glow -->
  <circle cx="32" cy="30" r="18" fill="#e11d48" opacity="0.32" filter="url(#subtleAura)" />

  <!-- Decorative Corner Rings (Layered in Background) -->
  <circle cx="56" cy="8" r="16" stroke="#fb7185" stroke-width="1" stroke-dasharray="3 3" opacity="0.15" />
  <circle cx="8" cy="56" r="14" stroke="#fb7185" stroke-width="0.8" opacity="0.12" />

  <!-- Main Luxury Ruby Mark -->
  <g filter="url(#rubyGlow)">
    <!-- Gem Top Crown -->
    <path d="M20 18 L44 18 L52 28 L12 28 Z" fill="url(#rubyTop)" />
    <!-- Gem Bottom Pavilion -->
    <path d="M12 28 L52 28 L32 50 Z" fill="url(#rubyBottom)" />
    <!-- Facet Facets: Left & Right Triangles -->
    <path d="M20 18 L26 28 L12 28 Z" fill="#fda4af" opacity="0.3" />
    <path d="M44 18 L38 28 L52 28 Z" fill="#881337" opacity="0.45" />
    <path d="M26 28 L38 28 L32 50 Z" fill="#be123c" />
    <path d="M12 28 L26 28 L32 50 Z" fill="#9f1239" opacity="0.75" />
    <path d="M52 28 L38 28 L32 50 Z" fill="#e11d48" opacity="0.85" />
    <!-- Center Table Facet -->
    <path d="M20 18 L44 18 L38 28 L26 28 Z" fill="url(#facetHighlight)" />
  </g>

  <!-- Gem Stroke Facet Outlines for Crystal Sharpness -->
  <path d="M20 18 L44 18 L52 28 L32 50 L12 28 Z" stroke="#ffe4e6" stroke-width="1.2" stroke-linejoin="round" opacity="0.75" />
  <path d="M20 18 L26 28 L32 50 M44 18 L38 28 L32 50 M26 28 L38 28" stroke="#ffe4e6" stroke-width="0.8" stroke-linejoin="round" opacity="0.45" />

  <!-- Sparkling Star Top-Right (AI / Magic) -->
  <path d="M46 10 C46 14 48 16 52 16 C48 16 46 18 46 22 C46 18 44 16 40 16 C44 16 46 14 46 10 Z" fill="url(#goldStarGrad)" />
  <circle cx="46" cy="16" r="1.2" fill="#ffffff" />

  <!-- Tiny sparkle bottom-left -->
  <path d="M16 42 C16 44 17 45 19 45 C17 45 16 46 16 48 C16 46 15 45 13 45 C15 45 16 44 16 42 Z" fill="#fecdd3" opacity="0.8" />
</svg>
