<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="prizeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="ebookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#prizeBg)"/>

  <!-- Golden Ray Rays -->
  <g stroke="#fbbf24" stroke-opacity="0.08" stroke-width="2">
    <line x1="400" y1="250" x2="100" y2="50"/>
    <line x1="400" y1="250" x2="250" y2="30"/>
    <line x1="400" y1="250" x2="400" y2="20"/>
    <line x1="400" y1="250" x2="550" y2="30"/>
    <line x1="400" y1="250" x2="700" y2="50"/>
  </g>

  <!-- Top Badge -->
  <g transform="translate(250, 40)">
    <rect width="300" height="36" rx="18" fill="#fbbf24" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.4"/>
    <text x="150" y="23" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#fde68a" text-anchor="middle" letter-spacing="0.08em">
      ★ ƯU ĐÃI &amp; QUÀ TẶNG ĐỘC QUYỀN ★
    </text>
  </g>

  <!-- Left: Ebook Mockup -->
  <g transform="translate(100, 110)">
    <!-- Book Shadow -->
    <rect x="15" y="15" width="180" height="250" rx="8" fill="#000000" fill-opacity="0.35"/>
    <!-- Book Body -->
    <rect x="0" y="0" width="180" height="250" rx="8" fill="url(#ebookGrad)" stroke="#818cf8" stroke-width="2"/>
    <!-- Book Spine 3D line -->
    <rect x="0" y="0" width="18" height="250" rx="4" fill="#312e81"/>
    
    <!-- Book Content -->
    <text x="100" y="65" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#a5b4fc" text-anchor="middle" letter-spacing="0.1em">EBOOK THỰC CHIẾN</text>
    <text x="100" y="95" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">VIBE CODING</text>
    <text x="100" y="120" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#38bdf8" text-anchor="middle">2026</text>
    
    <!-- Value Badge -->
    <rect x="35" y="180" width="130" height="32" rx="16" fill="#f59e0b"/>
    <text x="100" y="201" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">TRỊ GIÁ 500.000Đ</text>
    <text x="100" y="235" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#cbd5e1" text-anchor="middle">Tặng 50 vé đầu tiên</text>
  </g>

  <!-- Center: Golden 3D Trophy Cup -->
  <g transform="translate(340, 95)">
    <!-- Pedestal Base -->
    <rect x="30" y="240" width="60" height="20" rx="4" fill="#78350f"/>
    <rect x="20" y="255" width="80" height="15" rx="3" fill="#451a03"/>
    
    <!-- Cup Stem -->
    <rect x="54" y="195" width="12" height="48" fill="url(#goldGrad)"/>
    
    <!-- Cup Body -->
    <path d="M 20 100 C 20 185, 100 185, 100 100 Z" fill="url(#goldGrad)"/>
    <ellipse cx="60" cy="100" rx="40" ry="12" fill="#fef08a"/>
    
    <!-- Cup Handles -->
    <path d="M 22 110 C -10 110, -10 155, 26 155" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
    <path d="M 98 110 C 130 110, 130 155, 94 155" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Star on Cup -->
    <path d="M 60 120 L 63 130 L 73 130 L 65 136 L 68 146 L 60 140 L 52 146 L 55 136 L 47 130 L 57 130 Z" fill="#ffffff"/>
  </g>

  <!-- Right: Tech Gift Box & NFT Certificate -->
  <g transform="translate(520, 110)">
    <!-- Certificate Card -->
    <rect x="20" y="10" width="180" height="120" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="50" cy="40" r="16" fill="#10b981"/>
    <text x="50" y="45" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">✓</text>
    <text x="75" y="36" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#1e293b">CHỨNG NHẬN SỐ</text>
    <text x="75" y="52" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#059669">NFT-VERIFIED</text>
    <line x1="36" y1="75" x2="180" y2="75" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="36" y1="90" x2="160" y2="90" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="36" y1="105" x2="140" y2="105" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Branded Gift Box -->
    <g transform="translate(30, 150)">
      <rect x="0" y="25" width="160" height="95" rx="8" fill="#e11d48"/>
      <rect x="68" y="25" width="24" height="95" fill="#fef08a"/>
      <rect x="-6" y="15" width="172" height="20" rx="4" fill="#be123c"/>
      <rect x="68" y="15" width="24" height="20" fill="#fef08a"/>
      <!-- Ribbon Bow -->
      <ellipse cx="68" cy="8" rx="16" ry="10" fill="#fef08a"/>
      <ellipse cx="92" cy="8" rx="16" ry="10" fill="#fef08a"/>
      <circle cx="80" cy="10" r="6" fill="#f59e0b"/>
    </g>
  </g>

  <!-- Bottom Headline -->
  <text x="400" y="420" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">
    BỘ QUÀ TẶNG &amp; GIẢI THƯỞNG CÔNG NGHỆ
  </text>
  <text x="400" y="450" font-family="system-ui, sans-serif" font-size="15" font-weight="500" fill="#cbd5e1" text-anchor="middle">
    Trọn bộ tài liệu, áo thun độc quyền, cúp vinh danh và chứng chỉ số có chữ ký ban tổ chức
  </text>
</svg>

